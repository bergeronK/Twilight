<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070a14" />
<title>Twilight — Live Sky Dashboard & Twilight Ephemeris</title>
<meta name="description" content="Twilight is a real-time sky dashboard and twilight ephemeris: live sun and moon position, limiting magnitude, sextant windows, and precise civil, nautical, and astronomical dawn & dusk for any location — for stargazing and celestial navigation." />
<meta name="author" content="Twilight" />
<link rel="canonical" href="https://twilyte.info/" />
<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Twilight" />
<meta property="og:title" content="Twilight — Live Sky Dashboard & Twilight Ephemeris" />
<meta property="og:description" content="Real-time sky dashboard and twilight ephemeris for celestial navigation and stargazing: live sun & moon, limiting magnitude, sextant windows, and precise dawn & dusk." />
<meta property="og:url" content="https://twilyte.info/" />
<meta property="og:image" content="https://twilyte.info/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Twilight — live sky dashboard and twilight ephemeris" />
<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Twilight — Live Sky Dashboard & Twilight Ephemeris" />
<meta name="twitter:description" content="Real-time sky dashboard and twilight ephemeris for celestial navigation and stargazing." />
<meta name="twitter:image" content="https://twilyte.info/og-image.png" />
<meta name="twitter:image:alt" content="Twilight — live sky dashboard and twilight ephemeris" />
<!-- PWA / iOS -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Twilight" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600&family=Spectral:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  /* ---- Twilight design tokens: single source of truth for the whole app ---- */
  :root{
    /* surfaces */
    --bg:#070a14;            /* deepest base */
    --bg-glow:#101a30;       /* warm-navy radial highlight (console sky) */
    --bg-glow-2:#16203c;     /* radial highlight (ephemeris sky) */
    --surface:#0d1322;       /* panel */
    --surface-2:#141c30;     /* raised panel */
    --panel-glass:linear-gradient(180deg,rgba(20,28,48,.72),rgba(13,19,34,.72));
    --field-bg:rgba(8,11,26,.7);
    /* ink */
    --ink:#ece3cb;           /* primary text (warm parchment) */
    --ink-dim:#9c947f;       /* secondary text */
    --ink-faint:#7c8296;     /* tertiary text (AA-safe on --bg) */
    /* accent */
    --accent:#d9ad62;        /* brass */
    --accent-hi:#f0cd87;     /* brass highlight */
    --accent-soft:rgba(217,173,98,.12);
    --on-accent:#0a1018;     /* text on accent fills */
    /* buttons (soft, dusky — not full-brightness brass) */
    --btn-border:rgba(217,173,98,.30);
    --btn-fill:rgba(217,173,98,.15);
    --btn-fill-hi:rgba(217,173,98,.25);
    /* twilight bands (shared color key) */
    --band-day:#7fa9d8;
    --band-civil:#e08a3c;
    --band-naut:#5a7fb0;
    --band-astro:#2b3358;
    --band-night:#1a1f38;
    /* typography */
    --font-display:'Cormorant Garamond',Georgia,serif;  /* headings */
    --font-body:'Spectral',Georgia,serif;               /* running text */
    --font-ui:'Space Grotesk',sans-serif;               /* labels, UI, numerals */
    /* type scale (available for incremental adoption) */
    --text-2xs:10px;
    --text-xs:11px;
    --text-sm:13px;
    --text-md:15px;
    --text-lg:18px;
    --text-xl:22px;
    --text-2xl:28px;
    --text-3xl:clamp(26px,5.4vw,50px);
    /* lines & shape & elevation */
    --line:#2a3550;
    --radius:16px;
    --radius-sm:10px;
    --shadow-1:0 8px 30px rgba(0,0,0,.38);
    --shadow-2:0 2px 12px rgba(0,0,0,.22);
    --panel-top:rgba(255,255,255,.05);  /* hairline top highlight */
  }
  /* Hide the wordmark on very narrow screens so the tab bar never crowds */
  @media (max-width:420px){ .tw-brand-word{ display:none; } }
  /* Glassy "instrument panel" elevation: soft drop shadow + hairline top highlight */
  .tw-panel{ box-shadow:var(--shadow-1), inset 0 1px 0 var(--panel-top); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); -webkit-text-size-adjust: 100%; }
  #root { min-height: 100vh; }
  .boot, .err { font-family: ui-monospace, Menlo, Consolas, monospace; padding: 26px; line-height: 1.5; }
  .boot { color: var(--ink-dim); font-size: 13px; }
  .err { color: #e7b3a3; font-size: 12px; white-space: pre-wrap; }
  @keyframes tabFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  /* ---- accessibility ---- */
  :where(button,a,input,select,[tabindex]):focus-visible{
    outline:2px solid var(--accent-hi);
    outline-offset:2px;
    border-radius:6px;
  }
  .noscript{
    font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    color:var(--ink); background:var(--surface);
    max-width:520px; margin:18vh auto 0; padding:24px 26px;
    border:1px solid var(--line); border-radius:var(--radius); line-height:1.55;
  }
  .noscript h1{ font-family:var(--font-display); margin:0 0 8px; }
  /* Respect users who prefer reduced motion: stop the twinkle/fade animations */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>
<div id="root"><div class="boot">Starting Twilight…</div></div>
<noscript>
  <div class="noscript">
    <h1>Twilight needs JavaScript</h1>
    <p>Twilight is a live sky dashboard and twilight ephemeris that computes the Sun and Moon's position for your location in real time. Please enable JavaScript to view tonight's sky, sextant windows, and dawn &amp; dusk times.</p>
  </div>
</noscript>
<script>
  function showError(e){
    var r = document.getElementById('root');
    if (r) r.innerHTML = '<div class="err"><b>Twilight hit an error:</b>\n\n' +
      String((e && (e.stack || e.message)) || e).replace(/</g,'&lt;') + '</div>';
  }
  window.onerror = function(msg, src, line, col, error){ showError(error || msg); return true; };
</script>

  body: "The word comes from the Old English twi- (the same “two/half” root in twin and twice) joined to light — the half-light that is neither true day nor true night. Its German cousin Zwielicht carries exactly the same idea. So every time you say “twilight,” you’re literally naming the in-between light."

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {

}, {
