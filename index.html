  /* ---- Twilyte design tokens: single source of truth for the whole app ---- */
  :root{
    /* surfaces — warm near-black: a candle-lit instrument, not a blue dashboard */
    --bg:#0e0d0b;            /* deepest base */
    --bg-glow:#161410;       /* warm radial highlight (console sky) */
    --bg-glow-2:#181511;     /* radial highlight (ephemeris sky) */
    --surface:#14120f;       /* panel */
    --surface-2:#1a1713;     /* raised panel */
    --panel-glass:linear-gradient(180deg,rgba(26,23,19,.72),rgba(20,18,15,.72));
    --field-bg:rgba(16,14,11,.7);
    /* ink */
    --ink:#eae7e0;           /* primary text (warm white) */
    --ink-dim:#a09a8f;       /* secondary text */
    --ink-faint:#888174;     /* tertiary text: 4.6:1 on the lightest panel, 5.0 on --bg (was #7d766a, 4.3, under AA) */
    /* accent — brass, reserved for data that matters */
    --accent:#d2a04d;
    --accent-hi:#e5ba6e;
    --accent-soft:rgba(210,160,77,.12);
    --on-accent:#161006;     /* text on accent fills */
    /* buttons (quiet hairline chips; brass only appears on hover/active) */
    --btn-border:#2b2823;
    --btn-fill:rgba(210,160,77,.08);
    --btn-fill-hi:rgba(210,160,77,.15);
    --btn-ink:#b9b2a4;       /* neutral resting label */
    /* twilight bands (shared color key) */
    --band-day:#7fa9d8;
    --band-civil:#e08a3c;
    --band-naut:#5a7fb0;
    --band-astro:#2b3358;
    --band-night:#1a1f38;
    /* typography — strict job split: serif is the voice (wordmark, verdicts),
       Inter is the instrument (everything functional, with tabular numerals) */
    --font-display:'Cormorant Garamond',Georgia,serif;  /* wordmark + verdict lines only */
    --font-body:'Inter',system-ui,sans-serif;           /* running text */
    --font-ui:'Inter',system-ui,sans-serif;             /* labels, UI, numerals */
    /* type scale (available for incremental adoption) */
    --text-2xs:10px;
    --text-xs:11px;
    --text-sm:13px;
    --text-md:15px;
    --text-lg:18px;
    --text-xl:22px;
    --text-2xl:28px;
    --text-3xl:clamp(26px,5.4vw,50px);
    /* lines & shape & elevation */
    --line:#211f1b;
    --radius:16px;
    --radius-sm:10px;
    --shadow-1:0 8px 30px rgba(0,0,0,.38);
    --shadow-2:0 2px 12px rgba(0,0,0,.22);
    --panel-top:rgba(255,255,255,.05);  /* hairline top highlight */
  }
  /* Tabs: in the header on wide screens, a bar along the bottom on phones
     and small tablets, where the thumb is. On wide screens the <nav> is
     display:contents, so the buttons sit in the header's flex row as they
     always have. Moving them off the header also ended the 360-383px
     overflow that used to hide the wordmark on narrow phones. The !important
     rules override the buttons' inline top-tab styles. */
  .tw-tabs{ display:contents; }
  @media (max-width:780px){
    .tw-tabs{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:100;
      background:var(--bg); border-top:1px solid var(--line);
      box-shadow:0 -2px 12px rgba(0,0,0,.28);
      padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .tw-tab{
      flex:1 1 0; min-height:56px; font-size:13.5px !important;
      border-bottom:none !important; border-top:2px solid transparent !important;
    }
    .tw-tab[aria-current="page"]{ border-top-color:var(--accent) !important; }
    #root{ padding-bottom:calc(58px + env(safe-area-inset-bottom)); }
  }
  /* Free up room on small screens */
  @media (max-width:560px){ .tw-visitors{ display:none; } }
  /* Glassy "instrument panel" elevation: soft drop shadow + hairline top highlight */
  .tw-panel{ box-shadow:var(--shadow-1), inset 0 1px 0 var(--panel-top); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); -webkit-text-size-adjust: 100%; }
  #root { min-height: 100vh; }
  .boot, .err { font-family: ui-monospace, Menlo, Consolas, monospace; padding: 26px; line-height: 1.5; }
  .boot { color: var(--ink-dim); font-size: 13px; }
  .err { color: #e7b3a3; font-size: 12px; white-space: pre-wrap; }
  @keyframes tabFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @keyframes skyIn{from{opacity:0}to{opacity:1}}
  @keyframes wordsIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes twBrandStar{0%,100%{opacity:1}50%{opacity:.28}}
  /* ---- accessibility ---- */
  /* Visible to screen readers, not to the eye. Used for guidance that would
     be redundant on screen but is the whole interface without one. */
  .sr-only{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0;
  }
  /* !important: several fields set outline:none inline, and an inline style
     beats any stylesheet rule that isn't important, which left keyboard
     focus invisible on them. */
  :where(button,a,input,select,[tabindex]):focus-visible{
    outline:2px solid var(--accent-hi) !important;
    outline-offset:2px;
    border-radius:6px;
  }
  .noscript{
    font-family:ui-sans-serif,system-ui,sans-serif;
    color:var(--ink); background:var(--surface);
    max-width:520px; margin:18vh auto 0; padding:24px 26px;
    border:1px solid var(--line); border-radius:var(--radius); line-height:1.55;
  }
  .noscript h1{ font-family:var(--font-display); margin:0 0 8px; }
  /* Respect users who prefer reduced motion: stop the twinkle/fade animations */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>

<div id="root"><div class="boot">Starting Twilyte…</div></div>
<noscript>
  <div class="noscript">
    <h1>Twilyte needs JavaScript</h1>
    <p>Twilyte is a live sky dashboard and twilight ephemeris that computes the Sun and Moon's position for your location in real time. Please enable JavaScript to view tonight's sky, sextant windows, and dawn &amp; dusk times.</p>
  </div>
</noscript>
<script>
  function showError(e){
    var r = document.getElementById('root');
    if (!r) return;
    r.textContent = '';
    var d = document.createElement('div');
    d.className = 'err';
    var b = document.createElement('b');
    b.textContent = 'Twilyte hit an error:';
    d.appendChild(b);
    d.appendChild(document.createTextNode('\n\n' + String((e && (e.stack || e.message)) || e)));
    // A way out. Without it the only escape was closing the app.
    var btn = document.createElement('button');
    btn.textContent = 'Reload Twilyte';
    btn.style.cssText = 'display:block;margin-top:18px;padding:10px 18px;font:600 15px system-ui,sans-serif;color:#160f00;background:#e8b563;border:0;border-radius:9px;cursor:pointer';
    btn.onclick = function(){ location.reload(); };
    d.appendChild(btn);
    r.appendChild(d);
  }
  window.onerror = function(msg, src, line, col, error){ showError(error || msg); return true; };
</script>

const COUNTER_WORKER_URL = 'https://twilight-counter.ken-b39.workers.dev/';

// Asking the counter for the total is not a free read: the endpoint
// increments the first time it sees a visitor, so every ping is a potential
// +1. The Worker does dedupe, but it can only recognise a returning visitor by
// the request itself — and a phone's IP changes whenever the network does, so
// an hour away on cellular arrives looking like a brand-new person. This
// browser is the one place that actually knows it has been here before, so
// the window is enforced here, and the Worker's own check stays as a backstop
// for cleared storage.

  // https://localhost) isn't on the Worker's CORS allow-list, so the count
  // could never be shown there — but a plain GET needs no preflight, so the
  // request would still reach the Worker and be counted, on every launch,
  // since the failed fetch never starts the window. That is data collected
  // for nothing, which the App Store and Play privacy forms would have to
  // declare. Skipping it keeps the apps out of it entirely.
