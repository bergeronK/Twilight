# Cloudflare Worker behind the visitor count in index.html's header.
# Deploy from this directory: see README.md — set the IP_SALT secret first.
name = "twilight-counter"
main = "src/index.js"
# Not recorded when this was first deployed from the dashboard. The code uses
# only long-standard runtime APIs, so any recent date behaves the same; check
# Settings -> Runtime in the dashboard before the first deploy from here if you
# want it to match exactly.
compatibility_date = "2024-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "VISITORS"                        # TWILIGHT-VISITORS in the dashboard
id = "b235e008f29e4e279c74cd1f3be7d5d3"
